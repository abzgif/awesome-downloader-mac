name: Build macOS Release Candidate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Create SHA-256 checksums
        run: |
          cd release
          shasum -a 256 *.dmg *.zip 2>/dev/null > SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-candidate
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
